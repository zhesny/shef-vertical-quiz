<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Квиз — Игрок</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --red: #d32f2f; --green: #388e3c; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f4f8; 
            color: #333; 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; text-align: center; 
        }
        h1 { font-size: 1.8rem; color: var(--red); margin-bottom: 15px; }
        input { font-size: 1.3rem; padding: 12px; width: 80%; max-width: 300px; border-radius: 8px; border: 2px solid #ccc; margin: 8px 0; text-align: center; }
        input:focus { border-color: var(--green); outline: none; }
        
        button { font-size: 1.3rem; padding: 12px 20px; background: var(--green); color: #fff; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0; width: 100%; max-width: 300px; font-weight: bold; }
        button:disabled { background: #999; }
        
        .btn-secondary { background: #fff; color: #333; border: 2px solid var(--green); font-size: 1.1rem;}
        
        .option-btn { background: #fff; border: 2px solid #ccc; font-size: 1.1rem; padding: 15px; margin: 8px 0; width: 100%; text-align: left; color: #333; border-radius: 8px; }
        .option-btn.selected { background: #bbdefb; border-color: #1976d2; }
        .option-btn.correct { background: #c8e6c9; border-color: var(--green); }
        .option-btn.incorrect { background: #ffcdd2; border-color: var(--red); }
        
        #question-text { font-size: 1.4rem; margin: 15px 0; line-height: 1.3; font-weight: bold;}
        #status { font-size: 1.1rem; color: #666; margin-top: 15px; font-weight: bold;}
        .hidden { display: none; }
        
        #reader { width: 100%; max-width: 300px; margin: 10px auto; border: 2px solid var(--red); border-radius: 8px; overflow: hidden;}
        /* убираем дефолтные стили камеры */
        #reader__dashboard_section_csr button { background: var(--green) !important; color: #fff !important; border-radius: 5px !important; padding: 5px 10px !important;}
    </style>
</head>
<body>
    <div id="join-screen">
        <h1>Квиз «Гражданин и Патриот»</h1>
        
        <div id="join-options">
            <button id="scan-btn" class="btn-secondary" style="max-width: 300px;">📷 Сканировать QR-код</button>
            <div id="reader" class="hidden"></div>
            <p style="margin: 10px; color:#888; font-size: 0.9rem;">— или введите вручную —</p>
            <input type="text" id="room-input" placeholder="Код комнаты" maxlength="6" inputmode="numeric">
        </div>
        
        <input type="text" id="name-input" placeholder="Ваше имя" maxlength="20">
        <button id="join-btn" disabled>Войти</button>
        <div id="status"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="question-text"></div>
        <div id="options-container"></div>
        <div id="status"></div>
    </div>

    <script src="script.js"></script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyCH9xxkxYJh9AyvijYtXRfJxxyeHpi4VAs",
            authDomain: "shef-vertical-quiz.firebaseapp.com",
            databaseURL: "https://shef-vertical-quiz-default-rtdb.firebaseio.com",
            projectId: "shef-vertical-quiz",
            storageBucket: "shef-vertical-quiz.firebasestorage.app",
            messagingSenderId: "1018774801808",
            appId: "1:1018774801808:web:574527c619434f7128f715"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        var urlParams = new URLSearchParams(window.location.search);
        var roomCode = urlParams.get('room');
        var playerId = 'player_' + Math.random().toString(36).substr(2, 9);
        var hasAnswered = false;
        var currentDifficulty = 'easy';
        var mySelectedAnswer = -1;

        var joinScreen = document.getElementById('join-screen');
        var gameScreen = document.getElementById('game-screen');
        var roomInput = document.getElementById('room-input');
        var nameInput = document.getElementById('name-input');
        var joinBtn = document.getElementById('join-btn');
        var scanBtn = document.getElementById('scan-btn');
        var readerDiv = document.getElementById('reader');
        var questionText = document.getElementById('question-text');
        var optionsContainer = document.getElementById('options-container');
        var statusEl = document.getElementById('status');

        // камера
        var html5QrCode;
        scanBtn.onclick = function() {
            readerDiv.classList.remove('hidden');
            scanBtn.classList.add('hidden');
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                function(decodedText) {
                    html5QrCode.stop().then(function() {
                        readerDiv.classList.add('hidden');
                        scanBtn.classList.remove('hidden');
                        try {
                            var url = new URL(decodedText);
                            var code = url.searchParams.get('room');
                            if (code) {
                                roomInput.value = code;
                                checkJoinReady();
                                statusEl.textContent = "Код распознан!";
                            }
                        } catch(e) {
                            statusEl.textContent = "Неверный QR-код.";
                        }
                    });
                }
            ).catch(function(err) {
                statusEl.textContent = "Ошибка камеры. Введите вручную.";
                readerDiv.classList.add('hidden');
                scanBtn.classList.remove('hidden');
            });
        };

        if (roomCode) {
            roomInput.value = roomCode;
            roomInput.disabled = true;
        }

        function checkJoinReady() {
            if (roomInput.value.trim().length === 6 && nameInput.value.trim().length >= 2) joinBtn.disabled = false;
            else joinBtn.disabled = true;
        }
        roomInput.oninput = checkJoinReady;
        nameInput.oninput = checkJoinReady;

        joinBtn.onclick = function() {
            roomCode = roomInput.value.trim();
            var playerName = nameInput.value.trim();

            db.ref('rooms/' + roomCode).once('value').then(function(snapshot) {
                if (!snapshot.exists()) { 
                    statusEl.textContent = 'Комната не найдена!'; 
                    return; 
                }
                
                db.ref('rooms/' + roomCode + '/players/' + playerId).set({ name: playerName, score: 0 });
                joinScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                listenToGame();
                
                console.log("Игрок зашел: " + playerName); // оставил для дебага
            }).catch(function(err) { 
                statusEl.textContent = 'Ошибка подключения.'; 
            });
        };

        function listenToGame() {
            db.ref('rooms/' + roomCode).on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) return;
                
                if (data.difficulty) currentDifficulty = data.difficulty;

                if (data.status === 'waiting' || data.status === 'intro') {
                    questionText.textContent = 'Ждем начала...';
                    optionsContainer.innerHTML = '';
                    statusEl.textContent = 'Ведущий скоро начнет!';
                    return;
                }
                
                if (data.status === 'ended') {
                    questionText.textContent = 'Игра окончена!';
                    optionsContainer.innerHTML = '';
                    statusEl.textContent = 'Смотрите итоги на экране.';
                    return;
                }
                
                if (data.status === 'playing') {
                    if (data.correctAnswer !== -1 && data.correctAnswer !== undefined) {
                        showCorrectOnPhone(data.correctAnswer);
                    } else if (data.currentQuestion !== undefined) {
                        var qIndex = data.currentQuestion;
                        if (questionText.dataset.index != qIndex) {
                            renderQuestion(qIndex);
                        }
                    }
                }
            });
        }

        function renderQuestion(index) {
            var q = quizData[currentDifficulty][index];
            if (!q) return;

            hasAnswered = false;
            mySelectedAnswer = -1;
            questionText.textContent = q.question;
            questionText.dataset.index = index;
            optionsContainer.innerHTML = '';
            statusEl.textContent = 'Выберите ответ:';

            for (var i = 0; i < q.options.length; i++) {
                var btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = String.fromCharCode(65 + i) + ") " + q.options[i];
                btn.dataset.index = i;
                
                // замыкание
                (function(idx, b) {
                    b.onclick = function() { selectAnswer(idx, b); };
                })(i, btn);
                
                optionsContainer.appendChild(btn);
            }
        }

        function selectAnswer(index, btn) {
            if (hasAnswered) return;
            hasAnswered = true;
            mySelectedAnswer = index;

            var allBtns = document.querySelectorAll('.option-btn');
            for (var i=0; i<allBtns.length; i++) {
                allBtns[i].disabled = true;
                allBtns[i].classList.remove('selected');
            }
            btn.classList.add('selected');

            db.ref('rooms/' + roomCode + '/answers/' + playerId).set({ answer: index, timestamp: Date.now() });
            statusEl.textContent = 'Ждем остальных...';
        }

        function showCorrectOnPhone(correctIndex) {
            var btns = document.querySelectorAll('.option-btn');
            if (btns.length === 0) return;

            for (var i = 0; i < btns.length; i++) {
                btns[i].disabled = true;
                var idx = parseInt(btns[i].dataset.index);
                
                if (idx === correctIndex) {
                    btns[i].classList.add('correct');
                } else if (idx === mySelectedAnswer && mySelectedAnswer !== correctIndex) {
                    btns[i].classList.add('incorrect'); 
                }
            }

            if (mySelectedAnswer === correctIndex) {
                statusEl.textContent = '✅ Верно!';
                statusEl.style.color = 'var(--green)';
            } else if (mySelectedAnswer !== -1) {
                statusEl.textContent = '❌ Ошибка. Правильный: ' + String.fromCharCode(65 + correctIndex);
                statusEl.style.color = 'var(--red)';
            } else {
                statusEl.textContent = 'Правильный ответ: ' + String.fromCharCode(65 + correctIndex);
                statusEl.style.color = '#333';
            }
        }
    </script>
</body>
</html>
